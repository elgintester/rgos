---
# 功能模块：port_binding
# 部署时把 access 端口绑定到业务 VLAN，回滚时解绑端口（端口回到默认 VLAN 1）。
#
# 部署怪癖：'switchport mode access' 是 RGOS 默认值，设备不存储这行，
# 所以每次运行文本 diff 都会认为它缺失。因此整个配置块的门控基于
# "所有目标端口是否已携带业务 VLAN"，而不是依赖 diff。
#
# 回滚怪癖（设备实测）：'no switchport access vlan' 不能带 VLAN ID——
# 'no switchport access vlan 100' 会被拒绝并报 '% Invalid input'。
# 裸 'no' 会移除绑定并把端口放回默认 VLAN。刻意不做"恢复到基线"机制。

- name: "[port_binding] Initialize ports_in_svc_vlan"
  ansible.builtin.set_fact:
    ports_in_svc_vlan: []

- name: "[port_binding] Work out which ports are already in the service VLAN"
  ansible.builtin.set_fact:
    ports_in_svc_vlan: "{{ ports_in_svc_vlan + [item.item] }}"
  loop: "{{ port_rc.results }}"
  loop_control:
    label: "{{ item.item.short }}"
  when: >-
    item.stdout is search(
      '(?m)^\\s*switchport access vlan\\s+%s(\\s|$)' | format(dev.svc_vlan)
    )

# --- 部署 ----------------------------------------------------------------

- name: "[port_binding][deploy] Bind the access ports to the service VLAN"
  elgintester.rgos.rgos_config:
    content: |
      {% for p in dev.svc_ports %}
      interface {{ p.name }}
       switchport mode access
       switchport access vlan {{ dev.svc_vlan }}
      {% endfor %}
  when: >-
    svc_vlan_state | default('deployed') == 'deployed'
    and ports_in_svc_vlan | map(attribute='short') | list
        != dev.svc_ports | map(attribute='short') | list
  register: port_push

- name: "[port_binding][deploy] Verify - every port joined the service VLAN"
  ansible.netcommon.cli_command:
    command: "show vlan"
  register: vlan_members
  changed_when: false
  when: svc_vlan_state | default('deployed') == 'deployed'

- name: "[port_binding][deploy] Assert every port joined the service VLAN"
  ansible.builtin.assert:
    # 'show vlan' 可能显示短名 TF0/15 或全名 TFGigabitEthernet 0/15
    that:
      - item.short in vlan_members.stdout or item.name in vlan_members.stdout
    fail_msg: "Port {{ item.short }} is NOT a member of VLAN {{ dev.svc_vlan }}"
    success_msg: "Port {{ item.short }} joined VLAN {{ dev.svc_vlan }}"
  loop: "{{ dev.svc_ports }}"
  loop_control:
    label: "{{ item.short }}"
  when: svc_vlan_state | default('deployed') == 'deployed'

# --- 回滚 ----------------------------------------------------------------

- name: "[port_binding][rollback] Unbind the ports from the service VLAN"
  elgintester.rgos.rgos_config:
    content: |
      {% for p in ports_in_svc_vlan %}
      interface {{ p.name }}
       no switchport access vlan
      {% endfor %}
  when: svc_vlan_state | default('deployed') == 'rolledback' and ports_in_svc_vlan | length > 0
  register: port_unbind

- name: "[port_binding][rollback] Verify - dot1x and port binding are gone"
  ansible.netcommon.cli_command:
    command: "show running-config interface {{ item.name }}"
  register: port_rc_after
  changed_when: false
  loop: "{{ dev.svc_ports }}"
  loop_control:
    label: "{{ item.name }}"
  when: svc_vlan_state | default('deployed') == 'rolledback'

- name: "[port_binding][rollback] Assert the service VLAN binding is gone from every port"
  ansible.builtin.assert:
    that:
      - >-
        not (item.stdout is search('(?m)^\\s*switchport access vlan\\s+%s(\\s|$)' | format(dev.svc_vlan)))
    fail_msg: "Port {{ item.item.name }} still bound to VLAN {{ dev.svc_vlan }}"
    success_msg: "Port {{ item.item.name }} unbound from VLAN {{ dev.svc_vlan }}"
  loop: "{{ port_rc_after.results }}"
  when: svc_vlan_state | default('deployed') == 'rolledback'

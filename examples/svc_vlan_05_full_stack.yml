# ============================================================================
# 示例 05：全套配置（vlan + svi + port_binding + aaa + dot1x，5 个模块全开）
# ============================================================================
# 场景：客户需要完整的业务 VLAN 部署——VLAN + 三层接口 + 端口绑定 +
#       RADIUS 认证 + 802.1X 端口控制。
#
# 开启的模块：全部 5 个
# 必需参数：svc_devices（svc_vlan, svc_ip, svc_mask, svc_ports）
#           svc_aaa（radius_host, radius_key, auth_list, dot1x 相关命令）
#
# 执行顺序（deploy）：vlan → svi → port_binding → aaa → dot1x
# 执行顺序（rollback）：dot1x → aaa → port_binding → svi → vlan（逆序）
#
# 幂等性：第二次运行所有模块都报告 changed=false（radius key 除外，
#         因为 RGOS 加密存储无法明文 diff，但 key 只写一次不会重复下发）。
#
# 运行：
#   ansible-playbook examples/svc_vlan_05_full_stack.yml --check   # 预览
#   ansible-playbook examples/svc_vlan_05_full_stack.yml            # 执行
#
# 回滚：把 svc_vlan_state 改为 rolledback，或运行示例 06。
# ============================================================================
- name: Deploy the full service VLAN stack (VLAN + SVI + ports + AAA + dot1x)
  hosts: ruijie
  gather_facts: false

  vars:
    # 全部 5 个模块开启（这也是默认值，显式写出是为了示例清晰）
    svc_features:
      vlan: true
      svi: true
      port_binding: true
      aaa: true
      dot1x: true

    # 共享 AAA/radius/dot1x 配置
    svc_aaa:
      enabled: true
      radius_host: 172.17.99.212
      radius_key: "your-radius-secret"
      auth_list: default
      dot1x_cmd: "dot1x port-control auto"
      dot1x_remove: "no dot1x port-control auto"
      dot1x_auth_cmd: "dot1x authentication default"
      dot1x_auth_remove: "no dot1x authentication"

    # 每台设备独立参数
    svc_devices:
      s6150-01:
        svc_vlan: 100
        svc_vlan_name: "OPS_SERVICE_01"
        svc_ip: 92.89.100.1
        svc_mask: 255.255.255.0
        svc_secondary_ip: ""
        svc_ports:
          - { name: TFGigabitEthernet 0/15, short: TF0/15 }
          - { name: TFGigabitEthernet 0/16, short: TF0/16 }
      s6150-02:
        svc_vlan: 101
        svc_vlan_name: "OPS_SERVICE_02"
        svc_ip: 92.89.101.1
        svc_mask: 255.255.255.0
        svc_secondary_ip: ""
        svc_ports:
          - { name: TFGigabitEthernet 0/15, short: TF0/15 }
          - { name: TFGigabitEthernet 0/16, short: TF0/16 }

  roles:
    - role: elgintester.rgos.svc_vlan
      svc_vlan_state: deployed
